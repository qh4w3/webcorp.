<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - WebCorp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%233b82f6' rx='15'/%3E%3Ctext x='50' y='58' font-family='Inter, Arial, sans-serif' font-size='50' font-weight='800' fill='white' text-anchor='middle'%3E%3Ctspan dy='5'%3E%3C/tspan%3EWC%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<body>
  <header class="container">
    <nav class="navbar">
      <a href="index.html" class="logo">WebCorp</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>
  
  <main class="container">
    <section>
      <h2>Let's Build Something</h2>
      
      <div class="grid">
        <!-- FORM CARD -->
        <div class="card">
          <h3>Send a Message</h3>
          <form class="contact-form" action="https://formsubmit.co/zuluqhawe143@gmail.com" method="POST">
            <!-- Stop spam + redirect -->
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="New WebCorp Project Inquiry!">
            <input type="hidden" name="_next" value="thanks.html">

            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="5" placeholder="Tell me about your project" required></textarea>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>

        <!-- CONTACT INFO CARD -->
        <div class="card">
          <h3>Other Ways to Reach Us</h3>
          <p style="margin-bottom:1rem; color:var(--text-muted)">Need a faster reply? Hit us on WhatsApp.</p>
          
          <p><strong>Email:</strong> zuluqhawe143@gmail.com</p>
          
          <a href="https://wa.me/27789390383" target="_blank" class="btn" style="background:#25D366; color:white; margin-top:1rem; width:100%; text-align:center;">
            💬 Chat on WhatsApp
          </a>

          <p style="margin-top:1.5rem; font-size:0.9rem; color:var(--text-muted)">
            Response recieved within a few hours, Mon - Sun
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer><p>© 2026 WebCorp. Built with care.</p></footer>
